# Builds the macOS native installer (DMG + PKG) on push to main.
name: Mac Client

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven (includes native installer)
        run: mvn -B install --file pom.xml

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: target/installer/*.dmg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: mac-pkg
          path: target/installer/*.pkg
